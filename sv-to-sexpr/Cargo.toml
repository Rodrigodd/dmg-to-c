[package]
name = "sv-to-sexpr"
version = "0.1.0"
edition = "2024"

[dependencies]
petgraph = "0.8"
sexpr-fmt = { path = "../sexpr-fmt" }

[dev-dependencies]
proptest = "1"

[profile.bench]
debug = true

# The exact-cover search in the decomposition audit runs about twenty times
# slower unoptimized, which alone exceeds the `.config/nextest.toml` timeout.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
